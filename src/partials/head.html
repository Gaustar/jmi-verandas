{{head_extra}}  <link rel="stylesheet" href="{{base}}assets/css/styles.css?v={{v}}">

  <script>
    /* Le thème suit l'appareil ; ?theme=dark ou ?theme=light dans l'adresse sert aux essais. Rien n'est mémorisé. */
    try {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
