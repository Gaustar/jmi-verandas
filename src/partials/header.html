  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="brand" href="{{base}}" aria-label="{{site.name}}, accueil">
        <img src="{{base}}assets/img/logo.png" alt="" width="148" height="69">
      </a>

      <nav class="nav" id="nav" aria-label="Navigation principale">
        <a href="{{base}}" data-nav="home">Accueil</a>
        <a href="{{base}}verandas-chassis/" data-nav="products">Véranda &amp; châssis</a>
        <a href="{{base}}realisations/" data-nav="gallery">Réalisations</a>
        <a href="{{base}}contact/" data-nav="contact">Contact</a>
        <a class="nav-phone" href="tel:{{site.phoneIntl}}">{{site.phone}}</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Basculer entre thème clair et sombre">

        </button>
        <a class="btn btn--ghost btn--sm desk-only" href="tel:{{site.phoneIntl}}">{{site.phone}}</a>
        <a class="btn btn--primary btn--sm" href="{{base}}contact/">Devis gratuit</a>
        <button class="burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Ouvrir le menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
