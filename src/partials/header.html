  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="brand" href="{{base}}" aria-label="JMI Verandas · Pierrot Jean-Michel, accueil">
{{> logo}}
      </a>

      <nav class="nav" id="nav" aria-label="Navigation principale">
        <a href="{{base}}" data-nav="home">Accueil</a>
        <a href="{{base}}verandas-chassis/" data-nav="products">Véranda &amp; châssis</a>
        <a href="{{base}}realisations/" data-nav="gallery">Réalisations</a>
        <a href="{{base}}contact/" data-nav="contact">Contact</a>
        <a class="nav-facebook" href="{{site.facebook}}" target="_blank" rel="noopener" aria-label="Facebook (nouvelle fenêtre)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8c-.3 0-1.3-.2-2.4-.2-2.5 0-4.1 1.5-4.1 4.2v2.7H7.6v3.3h2.8V22h3.1Z"/></svg>
          <span class="nav-facebook-label">Facebook</span>
        </a>
      </nav>

      <div class="header-actions">
        <a class="header-phone" href="tel:{{site.phoneIntl}}" aria-label="Appeler le {{site.phone}}">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
          <span>{{site.phone}}</span>
        </a>
        <a class="btn btn--primary btn--sm header-cta" href="{{base}}contact/">Devis gratuit</a>
        <button class="burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Ouvrir le menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
